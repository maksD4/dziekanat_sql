services:
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: dziekanat-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: dziekanat123
      APP_USER: dziekanat
      APP_USER_PASSWORD: dziekanat123
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  oracle-data:
